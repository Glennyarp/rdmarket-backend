<!DOCTYPE html>
<html lang="es">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>RDMARKET</title>
</head>
<body>
    <header class="main-header">
        <!-- Fila Superior -->
        <div class="header-top">
            <img src="logo-final.png" alt="RDMARKET" class="logo-img">
            
            <div class="search-container">
                <input type="text" placeholder="Buscar productos...">
                <button type="submit">🔍</button>
            </div>

            <div class="user-actions">
                <a href="#" class="app-download-link">📱 Descargar App</a>
                
                <div class="user-login">
                    <span class="hello-text">Hola,</span>
                    <a href="#" class="auth-link">Identifícate / Regístrate</a>
                </div>
                
                <a href="#" class="cart-link">🛒 Cesta</a>
            </div>
        </div>

        <!-- Fila Inferior (Categorías) -->
        <nav class="header-bottom">
            <div class="categories-menu">☰ Todas las categorías</div>
            <a href="#">SuperOfertas</a>
            <a href="#">Electrodomésticos</a>
            <a href="#">Ropa de hombre</a>
            <a href="#">Juguetes</a>

</html>
