<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>RDMARKET - Panel de Administración</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .admin-layout { display: flex; gap: 30px; max-width: 1200px; margin: 30px auto; padding: 0 20px; }
        .seccion-formulario, .seccion-inventario { background: white; padding: 25px; border-radius: 12px; border: 1px solid #e2e8f0; }
        .seccion-formulario { flex: 1; }
        .seccion-inventario { flex: 2; }
        .tabla-inventario { width: 100%; border-collapse: collapse; margin-top: 15px; }
        .tabla-inventario th, .tabla-inventario td { padding: 12px; text-align: left; border-bottom: 1px solid #e2e8f0; vertical-align: middle; }
        .tabla-inventario th { background-color: #f7fafc; color: #4a5568; font-weight: 600; }
        .btn-tabla-eliminar { background: #e74c3c; color: white; border: none; padding: 6px 12px; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .badge-stock { padding: 4px 8px; border-radius: 12px; font-size: 0.8rem; font-weight: bold; }
        .stock-alto { background: #e6fffa; color: #234e52; }
        .stock-bajo { background: #fff5f5; color: #742a2a; }
        .mini-imagen-tabla { width: 45px; height: 45px; object-fit: cover; border-radius: 6px; border: 1px solid #e2e8f0; }
    </style>
</head>
<body>

    <header class="tienda-header">
        <h1>RDMARKET - Panel de Control</h1>
        <button onclick="sessionStorage.removeItem('adminAutenticado'); window.location.href='index.html';" class="carrito-icono-resumen" style="background:#e74c3c; border-color:#c0392b;">🔒 Cerrar Sesión</button>
    </header>

    <main class="admin-layout">
        <section class="seccion-formulario">
            <h2>Agregar Producto</h2>
            <p style="color: #718096; font-size: 0.9rem; margin-bottom: 20px;">Inserta un nuevo artículo al catálogo general.</p>
            
            <form id="form-agregar-producto" onsubmit="guardarProducto(event)">
                <div class="campo-grupo">
                    <label for="prod-nombre">Nombre del Producto:</label>
                    <input type="text" id="prod-nombre" required placeholder="Ej. Cargador Tipo C">
                </div>
                <div class="campo-grupo">
                    <label for="prod-descripcion">Descripción breve:</label>
                    <textarea id="prod-descripcion" required placeholder="Ej. Cargador usb tipo c con carga rápida"></textarea>
                </div>
                <div class="campo-grupo">
                    <label for="prod-imagen">URL de la Imagen:</label>
                    <input type="url" id="prod-imagen" placeholder="Ej. https://enlace.com/imagen.jpg">
                    <small style="color: #a0aec0; display:block; margin-top:4px;">Copia el enlace de cualquier imagen de internet.</small>
                </div>
                <div class="campo-grupo">
                    <label for="prod-precio">Precio (RD$):</label>
                    <input type="number" id="prod-precio" required min="1" placeholder="Ej. 150">
                </div>
                <div class="campo-grupo">
                    <label for="prod-stock">Stock Inicial:</label>
                    <input type="number" id="prod-stock" required min="0" placeholder="Ej. 100">
                </div>
                <button type="submit" class="btn-pagar" style="width: 100%; margin-top: 15px;">💾 Guardar en Base de Datos</button>
            </form>
        </section>

        <section class="seccion-inventario">
            <h2>Inventario en Tiempo Real</h2>
            <p style="color: #718096; font-size: 0.9rem;">Lista de artículos sincronizados directamente con Railway.</p>
            <table class="tabla-inventario">
                <thead>
                    <tr>
                        <th>Imagen</th>
                        <th>Producto</th>
                        <th>Precio</th>
                        <th>Stock</th>
                        <th>Acción</th>
                    </tr>
                </thead>
                <tbody id="tabla-cuerpo-productos">
                    <tr><td colspan="5" style="text-align: center; color: #a0aec0;">Cargando inventario...</td></tr>
                </tbody>
            </table>
        </section>
    </main>

    <script src="admin.js"></script>
</body>
</html>
