<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Admin - RDMARKET</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        input { display: block; margin: 10px 0; padding: 8px; width: 300px; }
    </style>
</head>
<body>
    <h2>Panel de Administración</h2>
    <form id="form-producto">
        <input type="text" id="nombre" placeholder="Nombre del producto" required>
        <input type="text" id="descripcion" placeholder="Descripción">
        <input type="number" id="precio" placeholder="Precio" required>
        <input type="number" id="stock" placeholder="Stock" required>
        <button type="submit">Guardar Producto</button>
    </form>

    <script>
        document.getElementById('form-producto').addEventListener('submit', (e) => {
            e.preventDefault();
            
            const data = {
                nombre: document.getElementById('nombre').value,
                descripcion: document.getElementById('descripcion').value,
                precio: document.getElementById('precio').value,
                stock: document.getElementById('stock').value
            };

            // CORRECCIÓN: Agregamos https:// al inicio y el endpoint /productos al final
    fetch('https://rdmarket-backend-production.up.railway.app/productos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
    })
            .then(res => res.json())
            .then(result => {
                alert(result.message);
                document.getElementById('form-producto').reset(); // Limpia el formulario
            })
            .catch(err => console.error("Error al guardar:", err));
        });
    </script>
</body>
</html>
