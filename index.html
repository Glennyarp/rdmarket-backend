<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDMARKET - Tienda Oficial</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header class="tienda-header">
        <h1>Bienvenidos a RDMARKET</h1>
        <button class="carrito-icono-resumen" onclick="conmutarVisibilidadCarrito()">
            🛒 Carrito (<span id="contador-articulos">0</span>)
        </button>
    </header>

    <div class="contenedor-principal">
        
        <main class="seccion-productos">
            <h2>Nuestro Catálogo</h2>
            <div id="contenedor-productos" class="productos-grid">
                <p class="estado-carga">Cargando catálogo de productos...</p>
            </div>
        </main>

        <aside id="panel-carrito" class="seccion-carrito">
            <h2>Tu Carrito</h2>
            <div class="linea-divisoria"></div>
            
            <div id="elementos-carrito">
                <p style="color: #a0aec0; text-align: center; margin-top: 20px;">El carrito está vacío.</p>
            </div>

            <div class="linea-divisoria"></div>
            
            <div class="carrito-total-zona">
                <span>Total:</span>
                <span id="precio-total">RD$ 0</span>
            </div>

            <div class="carrito-botones-bloque">
                <button class="btn-vaciar" onclick="vaciarCarrito()">Vaciar Carrito</button>
                <button class="btn-pagar" onclick="abrirModalPedido()">Proceder al Pago</button>
            </div>
        </aside>
    </div>

    <div id="modal-checkout" class="modal-fondo">
        <div class="modal-contenido">
            <span class="modal-cerrar" onclick="cerrarModalPedido()">&times;</span>
            <h2>Finalizar Pedido</h2>
            <p style="color: #718096; font-size: 0.9rem; margin-bottom: 20px;">
                Completa tus datos para procesar tu orden vía WhatsApp.
            </p>

            <form id="form-checkout" onsubmit="enviarPedidoWhatsApp(event)">
                <div class="campo-grupo">
                    <label for="usr-nombre">Nombre Completo:</label>
                    <input type="text" id="usr-nombre" required placeholder="Ej. Juan Pérez">
                </div>

                <div class="campo-grupo">
                    <label for="usr-telefono">Teléfono / WhatsApp:</label>
                    <input type="tel" id="usr-telefono" required placeholder="Ej. 809-555-5555">
                </div>

                <div class="campo-grupo">
                    <label for="usr-direccion">Dirección de Entrega:</label>
                    <textarea id="usr-direccion" required placeholder="Ej. Av. Venezuela, Esq. Las Américas, Ens. Ozama"></textarea>
                </div>

                <div class="resumen-caja">
                    <h3>Resumen de Compra</h3>
                    <div id="modal-resumen-productos">
                        </div>
                    <div class="linea-divisoria" style="margin: 10px 0;"></div>
                    <div style="display: flex; justify-content: space-between; font-weight: bold;">
                        <span>Total a Pagar:</span>
                        <span id="modal-total-pago" style="color: #2ecc71;">RD$ 0</span>
                    </div>
                </div>

                <button type="submit" class="btn-enviar-wa">📩 Confirmar y Enviar por WhatsApp</button>
            </form>
        </div>
    </div>

    <script src="tienda.js"></script>
</body>
</html>
