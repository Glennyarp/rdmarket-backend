<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RDMARKET - Login Administrativo</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .login-contenedor {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 80vh;
        }
        .login-tarjeta {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            border: 1px solid #e2e8f0;
            width: 100%;
            max-width: 400px;
        }
        .login-tarjeta h2 {
            margin-bottom: 10px;
            text-align: center;
            color: #1a202c;
        }
        .btn-ingresar {
            background-color: #3182ce;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            margin-top: 15px;
            font-size: 1rem;
        }
        .btn-ingresar:hover { background-color: #2b6cb0; }
        .error-alerta {
            color: #e74c3c;
            background: #fff5f5;
            padding: 10px;
            border-radius: 6px;
            text-align: center;
            margin-bottom: 15px;
            display: none;
            font-size: 0.9rem;
            font-weight: 600;
        }
    </style>
</head>
<body>

    <header class="tienda-header">
        <h1>RDMARKET - Acceso Restringido</h1>
        <a href="index.html" style="text-decoration: none;" class="carrito-icono-resumen">🌐 Ir a la Tienda</a>
    </header>

    <main class="login-contenedor">
        <div class="login-tarjeta">
            <h2>Iniciar Sesión</h2>
            <p style="color: #718096; text-align: center; font-size: 0.9rem; margin-bottom: 25px;">
                Ingresa tus credenciales para administrar el inventario.
            </p>

            <div id="login-error" class="error-alerta">Usuario o contraseña incorrectos</div>

            <form id="form-login" onsubmit="procesarLogin(event)">
                <div class="campo-grupo">
                    <label for="login-user">Usuario:</label>
                    <input type="text" id="login-user" required placeholder="Tu usuario">
                </div>

                <div class="campo-grupo">
                    <label for="login-pass">Contraseña:</label>
                    <input type="password" id="login-pass" required placeholder="••••••••">
                </div>

                <button type="submit" class="btn-ingresar">🔑 Entrar al Panel</button>
            </form>
        </div>
    </main>

    <script>
        function procesarLogin(event) {
            event.preventDefault();
            
            const usuario = document.getElementById('login-user').value;
            const contrasena = document.getElementById('login-pass').value;
            const alerta = document.getElementById('login-error');

            // DEFINE AQUÍ TU USUARIO Y CONTRASEÑA
            if (usuario === "admin" && contrasena === "rdmarket2026") {
                // Guardamos una sesión temporal en el navegador
                sessionStorage.setItem('adminAutenticado', 'true');
                // Redireccionar al panel administrativo
                window.location.href = "admin.html";
            } else {
                alerta.style.display = "block";
            }
        }
    </script>
</body>
</html>
