              <script>
    console.log("El script ha iniciado. Intentando conectar con el servidor...");

    // Esta función se encarga de todo el proceso de carga
    function cargarProductos() {
        fetch('http://localhost:3000/productos')
            .then(response => {
                if (!response.ok) throw new Error('Error al conectar con el servidor');
                return response.json();
            })
            .then(data => {
                console.log("¡ÉXITO! Datos recibidos:", data);
                const contenedor = document.getElementById('contenedor-productos');
                contenedor.innerHTML = ''; // Limpiamos el mensaje de carga

                data.forEach(prod => {
                    const tarjeta = document.createElement('div');
                    tarjeta.className = 'producto';
                    tarjeta.innerHTML = `
                        <h3>${prod.nombre}</h3>
                        <p>Descripción: ${prod.descripcion}</p>
                        <p>Precio: RD$ ${prod.precio}</p>
                    `;
                    contenedor.appendChild(tarjeta);
                });
            })
            .catch(error => {
                console.error("ERROR DETECTADO:", error);
                document.getElementById('contenedor-productos').innerHTML = 
                '<p style="color: red;">Error: No se pudo conectar al servidor. Revisa la consola (F12).</p>';
            });
    }

    // Ejecutamos la función inmediatamente
    cargarProductos();
</script>
</script>
